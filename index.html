<!DOCTYPE html>
<html lang="en" class="scrollbar-thin scrollbar-thumb-green-700">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon">
    <link rel="stylesheet" href="./css/output.css">
    <script src="https://kit.fontawesome.com/a034b0a078.js" crossorigin="anonymous"></script>

    <title>Wear</title>
</head>
<body class="bg-black text-white ">
    <header class="w-full px-3 pt-4 bg-gray-900 fixed top-0 z-10">
        <div class="w-11/12 m-auto flex justify-between items-center">

            <a href="#">
                <img src="assets/logo.png" class="w-39" alt="Logo">
            </a>
            
            <div class="relative">
                <input type="text" placeholder="Rechercher un produit..." id="search" 
                class="border-2 border-gray-800 p-2 lg:w-112.5  md:w-80.5">
                <i class="fas fa-search absolute text-2xl right-2.5 top-2.5" ></i>
            </div>
            
            <div id="panier" class="border-2 border-gray-800 p-2.5 rounded active:bg-green-700 hover:bg-gray-600 cursor-pointer">
                <i class="fas fa-cart-arrow-down"></i>
                <span id="prix-total-icon">0</span>DH
            </div>
        </div>
        <!-- =================================================== Cart space -->
         <!-- w-11/12 -->
         <div id="cart-space" class="fixed z-10 lg:w-162.5 md:w-155 h-screen bg-gray-900 top-41.25 -right-full transition-all shadow shadow-gray-300
            overflow-y-scroll scrollbar-thin scrollbar-thumb-green-700 pb-40">
            <!-- <div class="">No products yet!</div> -->

             <div class="rounded-xl m-3.5 overflow-hidden w-auto bg-gray-800 flex ">
                <img class="w-27 object-cover" src="https://media.easy-peasy.ai/27feb2bb-aeb4-4a83-9fb6-8f3f2a15885e/b243d9d5-44ae-4fad-a3f3-7e4b4ed2e3ea_medium.webp" 
                alt="T-shirt Noir Coton">

                <div class="p-info-container p-1 px-2 flex w-full justify-between items-end">
                    <div class="h-full">
                        <div class="nom text-2xl">T-shirt Noir Coton</div>
                        <div class="text-gray-700">M &nbsp;&nbsp;&nbsp; L &nbsp;&nbsp;&nbsp; XL</div>
                        <div class="text-green-700">
                            <div class="prix inline">40</div> DH
                        </div>
                        
                    </div>
                    <div class="flex items-center w-19.5 justify-between">
                        <button class="bg-green-700 h-fit  px-2 my-1.5 inline  rounded cursor-pointer hover:bg-green-900 ">+</button>
                        <span class="qty">5</span>
                        <button class="bg-green-700 h-fit  px-2 my-1.5 inline  rounded cursor-pointer hover:bg-green-900 ">-</button>
                    </div>

                    <button class="absolute top-5 right-5 cursor-pointer hover:text-red-700" title="Supprimer?">
                        <i class="fas fa-trash "></i></button>
                </div>
            </div>
         </div>
        <!-- =================================================== Nav space -->
         <nav class="w-full px-3 p-4 bg-gray-900 fixed left-0 top-23.25 z-5 ">
            <ul class="flex justify-around ">
                <li class="font-bold hover:text-green-700">
                    <a href="admin.html"><i class="fas fas fa-user-cog"></i> Admin</a>
                </li>
                <li class="font-bold hover:text-green-700 text-green-700">
                    <a href="index.html"><i class="fas fas fas fa-users "></i> User</a>
                </li>
                <li id="contact" class="font-bold bg-green-700 p-2 rounded hover:bg-green-500 cursor-pointer">
                    <i class="fas far fa-envelope"></i> Contactez-nous
                </li>
                </ul>
        </nav>
            
    </header>

    <main class="w-11/12 m-auto mt-40 mb-25 flex flex-col ">
        <!-- ======================================= Filter & Sort -->
         <div class="filter-trier flex justify-between items-center mt-5">
            <div class="">
                <label for="filtrer" class="text-gray-600">Filtrer par categories</label><br>
                <select name="filtrer" id="filtrer" class="border-2 border-gray-800 px-2 py-1 mt-1 h-fit rounded bg-black text-white">
                    <option value="Tout">Tout</option>
                    <option value="T-shirts">T-shirts</option>
                    <option value="Polos">Polos</option>
                    <option value="Chemises">Chemises</option>
                    <option value="Pantalons">Pantalons</option>
                    <option value="Shorts">Shorts</option>
                    <option value="Sweats">Sweats</option>
                    <option value="Pulls">Pulls</option>
                    <option value="Vestes">Vestes</option>
                    <option value="Manteaux">Manteaux</option>
                    <option value="Sport">Sport</option>
                </select>
            </div>

            <div class="">
                <label for="trier" class="text-gray-600">Trier par</label><br>
                <select name="trier" id="trier" class="border-2 border-gray-800 px-2 py-1 mt-1 h-fit rounded bg-black text-white">
                    <option value="asc">Prix croissant</option>
                    <option value="desc">Prix décroissant</option>
                    <option value="a-to-z">Marques de A à Z</option>
                    <option value="z-to-a">Marques de Z à A</option>
                </select>
            </div>
        </div>
        <!-- ======================================= -->
        
        <hr class="text-gray-800 my-7">
        <div class="layout-container border-2 border-gray-800 rounded w-fit p-1 flex justify-between self-end mb-5 ">
            <i class=" text-green-800 grid-list-layout fa-solid fa-list text-[30px] cursor-pointer hover:opacity-70"></i>
        </div>

        <section id="cards" class="w-11/12 m-auto mb-12 justify-items-center grid md:grid-cols-3 sm:grid-cols-2 lg:grid-cols-4 xl:grid-cols-5 gap-5 ">
            
<!-- ============================================= -->

            <div class="card rounded-xl overflow-hidden w-fit cursor-grab hover:opacity-80">
                <img class="w-50 object-cover" src="https://media.easy-peasy.ai/27feb2bb-aeb4-4a83-9fb6-8f3f2a15885e/b243d9d5-44ae-4fad-a3f3-7e4b4ed2e3ea_medium.webp" 
                alt="T-shirt Noir Coton">

                <div class="p-info-container p-1 flex flex-col ">
                    <div>

                        <div class="nom text-2xl">T-shirt Noir Coton</div>
                        <div class="text-gray-700">M &nbsp;&nbsp;&nbsp; L &nbsp;&nbsp;&nbsp; XL</div>
                        <div class="text-green-700">
                            <div class="prix inline">40</div> DH
                        </div>
                        <i class="fas fa-arrow-left"></i>
                        <i class="fas fa-arrow-right"></i>
                    </div>
                    <button class="add-to-cart bg-green-700 px-2 py-1 my-1.5 rounded cursor-pointer hover:bg-green-400 ">
                        Ajouter +</button>


                </div>
            </div>

        </section>
        <div id="pagination" class="m-auto"></div>
        <!-- ================================= Form To Contact -->

    <div class="form-container invisible flex items-center fixed top-0 right-0 z-20  w-full h-full bg-[#000000cb]">

        <form  class="relative mx-auto flex w-full max-w-md flex-col gap-5 rounded-2xl border border-gray-700 bg-gray-900 p-8 px-3 shadow-xl shadow-black/40">
            <div class="text-3xl text-center font-bold">Contactez-nous</div>
            <div class="flex flex-col gap-2">
                <label for="nom" class="text-sm font-bold ">Nom:</label>
                <input type="text" id="nom" placeholder="Entrez votre nom" class="rounded-lg border border-gray-700 bg-black px-4 py-2.5 text-white outline-none transition focus:border-green-500 ">
            </div>
            
            <div class="flex flex-col gap-2">
                <label for="address" class="text-sm font-bold ">Address:</label>
                <input type="text" id="address" placeholder="Entrez votre adresse" class="rounded-lg border border-gray-700 bg-black px-4 py-2.5 text-white outline-none transition focus:border-green-500 ">
            </div>
            
            <div class="flex flex-col gap-2">
                <label for="email" class="text-sm font-bold ">Email:</label>
                <input id="email" placeholder="Entrez votre e-mail" class="rounded-lg border border-gray-700 bg-black px-4 py-2.5 text-white outline-none transition focus:border-green-500 ">
            </div>
            
            <div class="flex flex-col gap-2">
                <label for="tel" class="text-sm font-bold ">Num de Tel:</label>
                <input id="tel" placeholder="Entrez votre numéro de téléphone" class="rounded-lg border border-gray-700 bg-black px-4 py-2.5 text-white outline-none transition focus:border-green-500 ">
            </div>
            
            <div class="flex gap-2">
                <button id="send" class="bg-green-700 px-2.5 py-1 rounded cursor-pointer hover:bg-green-400">
                    Envoyer
                </button>
                <button id="autofill" class="border-2 active:opacity-80 border-green-700 px-2.5 py-1 rounded cursor-pointer hover:bg-green-400">
                    Remplissage auto
                </button>
            </div>
            <!-- ----------------- -->
             <div class="fa-xmark hover:text-red-700 cursor-pointer absolute top-2.5 right-2.5 z-10">
                 <i class="fa-solid fa-xmark text-3xl font-bold relative -z-1"></i>
            </div>
        </form>
    </div>
    </main>

    <footer class="w-full h-30 bg-gray-950 flex flex-col justify-center items-center gap-2.5">
        <img src="assets/logo.png" alt="Logo" class="w-22.5">
        <div>Wear <span id="date"></span> © Tous droits réservés</div>
    </footer>
    <script type="module" src="main.js"></script>
</body>
</html>
